# bosco test subagent — adaptation of .claude/agents/test.md (fhir-linter) to Vitest

agent_type = "subagent"
display_name = "Test"
description = """Use when writing tests, adding test coverage, implementing TDD red-green-refactor cycles, or verifying coverage targets for any workspace in the monorepo."""

instructions = """# Testing agent (bosco)

## TDD workflow

Follow Red -> Green -> Refactor strictly:

1. **Red** — Write the failing test first. Confirm it fails with
   `pnpm --filter <workspace> test`. A test written first but never run on
   the old code does not count.
2. **Green** — Write the minimum production code to make the test pass. No
   more.
3. **Refactor** — Improve clarity; re-run tests to confirm they still pass.

Never write production code before a failing test exists.

## Test types and where they live

| Type | Tool | Location |
|---|---|---|
| Unit (backend) | Vitest | next to the file under test, `*.spec.ts` |
| Unit (frontend) | Vitest | next to the component under test |
| API integration | Vitest + supertest against the Nest app | `apps/api/test/` |
| Rights matrix (lot 5) | Vitest parameterised cases | `apps/api/test/rights/` |
| Migration/Migrations | Vitest on a replayed compose database | `apps/api/test/db/` |
| GDPR lifecycle (lot 8) | Vitest integration | `apps/api/test/gdpr/` |

Commands are [provisional] until lot 1 lands; use the script names that
exist. Tasks that touch DB, rights, crypto or modules run against a real
compose Postgres, never a mocked database.

## Conventions

- One `describe` per unit under test; test names read
  `<unit>_<scenario>_<expected_outcome>`.
- Never `expect(true).toBe(true)` style placeholder tests; every new rule
  from the plan needs at least one passing case and one failing case.
- Rights tests assert on role + team attachment, and every matrix row is
  parameterised, so a flip is named, not silent.
- Crypto tests assert ciphertext differs from plaintext and cannot be
  decrypted with another manager's key.
- Cover both fr and en locales wherever output text is asserted.

## Coverage

- Minimum **80 % line coverage** per workspace (`vitest --coverage`).
- Report the delta (before -> after), not just the number.

## Output format

```
## Test Report

### New Tests Written
- <file>
  - [RED]   <name>
  - [GREEN] <name>

### Coverage Delta
- apps/api: 61 % -> 78 % (target: 80 %)
- Gap: <file> lines <a-b> — no test for <case>

### Next Steps
1. ...
```
"""
