name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from the packageManager field of package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # swagger-ui-dist (via @nestjs/swagger) depends on @scarf/scarf, whose
        # post-install, run by pnpm 9, sends install telemetry to scarf.sh;
        # SCARF_ANALYTICS=false opts out.
        env:
          SCARF_ANALYTICS: 'false'
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (all workspaces)
        run: pnpm test

      - name: OpenAPI contract
        run: pnpm openapi:check

      - name: i18n fr/en keys
        run: pnpm i18n:check
