name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Release Please
        uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          package-name: bosco
